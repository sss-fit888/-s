<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カロリー計算ツール</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --primary-gradient: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-sub: #666666;
            --border-color: #e0e0e0;
            --accent-light: #fff0f3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .header {
            background: var(--primary-gradient);
            color: white;
            text-align: center;
            padding: 25px 20px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .content {
            padding: 25px 20px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .gender-select {
            display: flex;
            gap: 10px;
        }

        .gender-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: white;
            color: var(--text-sub);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .gender-btn.active {
            border-color: var(--primary-color);
            background: var(--accent-light);
            color: var(--primary-color);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s ease;
            background: white;
            appearance: none;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--primary-color);
        }

        .unit {
            position: absolute;
            right: 15px;
            color: var(--text-sub);
            font-size: 14px;
            pointer-events: none;
        }

        .calc-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .calc-btn:active {
            transform: scale(0.98);
        }

        .result-container {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card {
            background: #fdfbf7;
            border: 2px solid #f0e6d2;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #e0d8c3;
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-label {
            font-size: 14px;
            color: var(--text-sub);
        }

        .result-val {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
        }

        .result-val span {
            font-size: 13px;
            font-weight: normal;
        }

        .purpose-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border-left: 5px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .purpose-card.diet { border-left-color: #3b82f6; }
        .purpose-card.keep { border-left-color: #10b981; }
        .purpose-card.bulk { border-left-color: #f59e0b; }

        .purpose-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .purpose-val {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-color);
        }

        .purpose-desc {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔥 カロリー計算ツール</h1>
        <p>基礎代謝・消費カロリー・目標カロリーを簡単計算</p>
    </div>

    <div class="content">
        <div class="section-title">👤 基本情報を入力</div>

        <div class="form-group">
            <label>性別</label>
            <div class="gender-select">
                <div class="gender-btn active" onclick="setGender('male')">男性</div>
                <div class="gender-btn" onclick="setGender('female')">女性</div>
            </div>
        </div>

        <div class="form-group">
            <label>年齢</label>
            <div class="input-wrapper">
                <input type="number" id="age" value="25" min="1" max="120">
                <span class="unit">歳</span>
            </div>
        </div>

        <div class="form-group">
            <label>身長</label>
            <div class="input-wrapper">
                <input type="number" id="height" value="170" min="50" max="250">
                <span class="unit">cm</span>
            </div>
        </div>

        <div class="form-group">
            <label>体重</label>
            <div class="input-wrapper">
                <input type="number" id="weight" value="65" min="20" max="300">
                <span class="unit">kg</span>
            </div>
        </div>

        <div class="form-group">
            <label>1日の活動量</label>
            <select id="activity">
                <option value="1.2">ほぼ運動しない（デスクワーク中心）</option>
                <option value="1.375" selected>軽い運動（週に1回〜2回程度）</option>
                <option value="1.55">中程度の運動（週に3回〜5回程度）</option>
                <option value="1.725">激しい運動（週に6回〜7回程度）</option>
            </select>
        </div>

        <button class="calc-btn" onclick="calculate()">計算する</button>

        <div class="result-container" id="results">
            <div class="section-title">📊 計算結果</div>

            <div class="result-card">
                <div class="result-row">
                    <span class="result-label">基礎代謝量 (BMR)</span>
                    <span class="result-val" id="bmr-val">1633 <span>kcal</span></span>
                </div>
                <div class="result-row">
                    <span class="result-label">総消費カロリー (TDEE)</span>
                    <span class="result-val" id="tdee-val">2245 <span>kcal</span></span>
                </div>
            </div>

            <div class="section-title">🎯 目的別の目標摂取カロリー</div>

            <div class="purpose-card diet">
                <div class="purpose-title">
                    <span>減量（ダイエット）</span>
                    <span style="color: #3b82f6;">-300〜500 kcal</span>
                </div>
                <div class="purpose-val" id="diet-val">1745 〜 1945 kcal</div>
                <div class="purpose-desc">体脂肪を健康的に落とす目安カロリー</div>
            </div>

            <div class="purpose-card keep">
                <div class="purpose-title">
                    <span>体重維持</span>
                    <span style="color: #10b981;">±0 kcal</span>
                </div>
                <div class="purpose-val" id="keep-val">2245 kcal</div>
                <div class="purpose-desc">現在の体重をキープする目安カロリー</div>
            </div>

            <div class="purpose-card bulk">
                <div class="purpose-title">
                    <span>増量（バルクアップ）</span>
                    <span style="color: #f59e0b;">+300〜500 kcal</span>
                </div>
                <div class="purpose-val" id="bulk-val">2545 〜 2745 kcal</div>
                <div class="purpose-desc">筋肉量を効率よく増やす目安カロリー</div>
            </div>
        </div>
    </div>
</div>

<script>
    let selectedGender = 'male';

    function setGender(gender) {
        selectedGender = gender;
        const btns = document.querySelectorAll('.gender-btn');
        btns.forEach(btn => btn.classList.remove('active'));
        if (gender === 'male') {
            btns[0].classList.add('active');
        } else {
            btns[1].classList.add('active');
        }
    }

    function calculate() {
        const age = parseFloat(document.getElementById('age').value);
        const height = parseFloat(document.getElementById('height').value);
        const weight = parseFloat(document.getElementById('weight').value);
        const activity = parseFloat(document.getElementById('activity').value);

        if (!age || !height || !weight) {
            alert('すべての項目を入力してください。');
            return;
        }

        // ミフリンサンジョール式によるBMR計算
        let bmr = 0;
        if (selectedGender === 'male') {
            bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
        } else {
            bmr = (10 * weight) + (6.25 * height) - (5 * age) - 161;
        }

        bmr = Math.round(bmr);
        const tdee = Math.round(bmr * activity);

        document.getElementById('bmr-val').innerHTML = `${bmr.toLocaleString()} <span>kcal</span>`;
        document.getElementById('tdee-val').innerHTML = `${tdee.toLocaleString()} <span>kcal</span>`;

        const dietMin = Math.round(tdee - 500);
        const dietMax = Math.round(tdee - 300);
        const bulkMin = Math.round(tdee + 300);
        const bulkMax = Math.round(tdee + 500);

        document.getElementById('diet-val').innerText = `${dietMin.toLocaleString()} 〜 ${dietMax.toLocaleString()} kcal`;
        document.getElementById('keep-val').innerText = `${tdee.toLocaleString()} kcal`;
        document.getElementById('bulk-val').innerText = `${bulkMin.toLocaleString()} 〜 ${bulkMax.toLocaleString()} kcal`;

        document.getElementById('results').style.display = 'block';
        document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
